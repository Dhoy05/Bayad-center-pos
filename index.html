<style>
:root{--ink:#1e293b;--mut:#64748b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,Roboto,Arial,sans-serif;background:linear-gradient(#f4f6ff,#e9e6fa);color:var(--ink);min-height:100vh}
header{background:linear-gradient(135deg,#1d4ed8 0%,#6d28d9 100%);color:#fff;padding:14px 16px}
h1{margin:0;font-size:24px}
.sub{opacity:.9;font-size:14px;margin:4px 0 10px}
.pills{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{border:0;border-radius:99px;padding:10px 18px;font-weight:800;font-size:14px;font-family:inherit}
.pill.y{background:#fbbf24;color:#1e293b}.pill.g{background:#22c55e;color:#fff}.pill.w{background:#fff;color:#4338ca}
nav{position:sticky;top:0;z-index:30;display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:#f4f5ff;border-bottom:1px solid #dfe3f5;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:1.5px solid #d5dbf3;background:#fff;color:#334155;border-radius:99px;padding:9px 14px;font-size:14px;font-weight:700;font-family:inherit}
nav button.on{background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;border-color:transparent}
main{padding:12px;max-width:820px;margin:0 auto}
.card{background:#fff;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 6px 20px rgba(60,60,140,.08)}
.card h2{margin:0 0 10px;font-size:19px;color:#1d4ed8}
label{display:block;font-weight:800;color:#475569;margin:12px 0 6px;font-size:15px}
input,select,textarea{width:100%;padding:13px 14px;border:2px solid #dbe3f0;border-radius:16px;font-size:17px;background:#f8fafc;color:var(--ink);font-family:inherit}
textarea{min-height:110px;font-size:15px}
input:focus,select:focus,textarea:focus{outline:none;border-color:#6366f1;background:#fff}
input.fee{background:#ecfdf5;border-color:#86efac}
.btn{width:100%;margin-top:16px;padding:15px;border:0;border-radius:16px;font-size:18px;font-weight:800;color:#fff;background:linear-gradient(135deg,#2563eb,#4f46e5);font-family:inherit}
.btn:active{transform:scale(.98)}
.btn.sec{background:#e0e7ff;color:#3730a3}.btn.red{background:linear-gradient(135deg,#ef4444,#b91c1c)}.btn.grn{background:linear-gradient(135deg,#22c55e,#15803d)}
.btn.sm{width:auto;display:inline-block;margin:6px 6px 0 0;padding:9px 14px;font-size:14px}
.info{margin-top:12px;background:#eef2ff;border-radius:14px;padding:10px 14px;font-size:15px;line-height:1.6;color:#312e81}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{border-radius:18px;padding:12px 14px;color:#fff}
.kpi small{display:block;opacity:.92;font-size:13px}.kpi b{font-size:20px;word-break:break-all}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{color:#6366f1;text-align:left;padding:8px 6px;border-bottom:3px solid #e2e8f0;white-space:nowrap}
td{padding:9px 6px;border-bottom:1px solid #eef2f7;vertical-align:top}
.pos{color:#15803d;font-weight:800;white-space:nowrap}.neg{color:#dc2626;font-weight:800;white-space:nowrap}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.cnt{background:#e0e7ff;color:#4338ca;border-radius:99px;padding:7px 14px;font-weight:800;font-size:14px}
.mut{color:var(--mut);font-size:14px}
.warn{background:#fef3c7;border:1.5px solid #fbbf24;color:#78350f;border-radius:16px;padding:12px 14px;margin-bottom:12px;font-weight:600;font-size:14px}
.row{display:flex;gap:8px;align-items:center;font-weight:700;color:#475569}
.row input{flex:1;min-width:0}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #eef2f7}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chip{border:0;background:#e0e7ff;color:#3730a3;border-radius:99px;padding:8px 14px;font-weight:700;font-size:14px;font-family:inherit}
.ib{border:0;background:#f1f5f9;border-radius:10px;padding:6px 8px;font-size:15px;margin:1px}
.ap{border:2px solid #e0e7ff;border-radius:16px;padding:12px;margin-top:10px}
.tag{display:inline-block;background:#fee2e2;color:#b91c1c;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:800}
footer{text-align:center;font-weight:800;color:#3730a3;font-size:20px;padding:22px 10px 40px}
#modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:14px;overflow:auto}
.box{background:#fff;border-radius:22px;padding:18px;width:100%;max-width:460px;margin:20px auto}
.box h2{margin:0 0 6px;color:#1d4ed8;font-size:20px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1e293b;color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;opacity:0;transition:opacity .25s;z-index:200;max-width:90%;text-align:center;pointer-events:none}

/* ===== Dark mode ===== */

html.dark body{background:linear-gradient(#0b1120,#111827);color:#e2e8f0}
html.dark nav{background:#0f172a;border-bottom-color:#1e293b}

html.dark .ap{border-color:#334155}
html.dark .tag{background:#7f1d1d;color:#fecaca}
html.dark .pos{color:#4ade80}
html.dark .neg{color:#f87171}
html.dark .mut,html.dark .row{color:#94a3b8}

html.dark #toast{background:#e2e8f0;color:#0f172a}

</style>

<script type="text/plain" id="gsrc">/*
  Bayad Center POS — Online Sync + Awtomatikong Email
  Likha ni: Sir Leo
  HUWAG baguhin ang KEY sa ibaba. Ito ang password ng app mo.
*/
var KEY = '__KEY__';
var TZ = 'Asia/Manila';
var NAMES = {gcash: 'GCash', maya: 'Maya', bank: 'Bank', bills: 'Bills', load: 'Load', appt: 'Appointment', sim: 'Load n Sim', others: 'Others'};
var HEAD = ['id', 'u', 'S', 'k', 'd', 'serbisyo', 'uri', 'detalye', 'pumasok', 'lumabas', 'tubo', 'del', 'json'];
var NCOL = 13;

/* ---- Patakbuhin ng isang beses (Run > setup) ---- */
function setup() {
  items_();
  settings_();
  var p = PropertiesService.getScriptProperties();
  setTrigger_(parseInt(p.getProperty('HOUR') || '21', 10));
  Logger.log('Handa na. Pwede nang i-Deploy bilang Web app.');
}

function sh_(name, head) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var s = ss.getSheetByName(name);
  if (!s) {
    s = ss.insertSheet(name);
    s.getRange(1, 1, 1, head.length).setValues([head]);
    s.setFrozenRows(1);
    if (name === 'Items') {
      s.getRange('A:A').setNumberFormat('@');
      s.getRange('D:H').setNumberFormat('@');
      s.getRange('M:M').setNumberFormat('@');
    }
  }
  return s;
}
function items_() { return sh_('Items', HEAD); }
function settings_() { return sh_('Settings', ['key', 'u', 'S', 'json']); }
function props_() { return PropertiesService.getScriptProperties(); }
function out_(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }

function doGet() { return out_({ok: true, msg: 'Bayad Center POS sync - gumagana'}); }

function doPost(e) {
  var lock = LockService.getScriptLock();
  try {
    var r = JSON.parse(e.postData.contents);
    if (r.k !== KEY) return out_({ok: false, err: 'key'});
    lock.waitLock(25000);
    var now = Date.now(), res;
    if (r.a === 'sync') res = sync_(r, now);
    else if (r.a === 'mail') res = mail_(String(r.d), true);
    else if (r.a === 'cfg') res = cfg_(r);
    else if (r.a === 'ping') res = {ok: true};
    else res = {ok: false, err: 'action'};
    res.now = now;
    return out_(res);
  } catch (err) {
    return out_({ok: false, err: String(err)});
  } finally {
    try { lock.releaseLock(); } catch (x) {}
  }
}

function row_(it, now) {
  return [String(it.id), Number(it.u) || 0, now, it.k || 'tx', String(it.d || ''), NAMES[it.s] || String(it.s || ''),
    String(it.tl || ''), String(it.det || ''), Number(it.i) || 0, Number(it.o) || 0, Number(it.p) || 0, it.del ? 1 : 0, JSON.stringify(it)];
}

function getSet_() {
  var s = settings_();
  if (s.getLastRow() < 2) return null;
  var v = s.getRange(2, 1, 1, 4).getValues()[0];
  try { return {u: Number(v[1]), S: Number(v[2]), data: JSON.parse(v[3])}; } catch (e) { return null; }
}
function putSet_(u, now, data) {
  settings_().getRange(2, 1, 1, 4).setValues([['settings', u, now, JSON.stringify(data)]]);
}

function sync_(r, now) {
  var s = items_(), last = s.getLastRow();
  var vals = last > 1 ? s.getRange(2, 1, last - 1, NCOL).getValues() : [];
  var idx = {}, i;
  for (i = 0; i < vals.length; i++) idx[String(vals[i][0])] = i;
  var add = [], chg = [], wrote = {}, setWrote = false;
  (r.items || []).forEach(function (it) {
    if (!it || !it.id) return;
    var id = String(it.id), row = row_(it, now);
    if (idx.hasOwnProperty(id)) {
      var j = idx[id];
      if (j < vals.length) {
        if (Number(vals[j][1]) >= Number(it.u)) return;
        vals[j] = row; chg.push(j); wrote[id] = true;
      } else {
        var a = j - vals.length;
        if (Number(add[a][1]) >= Number(it.u)) return;
        add[a] = row; wrote[id] = true;
      }
    } else {
      idx[id] = vals.length + add.length;
      add.push(row); wrote[id] = true;
    }
  });
  if (chg.length > 12) s.getRange(2, 1, vals.length, NCOL).setValues(vals);
  else chg.forEach(function (j) { s.getRange(j + 2, 1, 1, NCOL).setValues([vals[j]]); });
  if (add.length) {
    s.getRange(s.getLastRow() + 1, 1, add.length, NCOL).setValues(add);
    vals = vals.concat(add);
  }
  var set = getSet_();
  if (r.settings && r.settings.u && r.settings.data && (!set || Number(set.u) < Number(r.settings.u))) {
    putSet_(r.settings.u, now, r.settings.data);
    set = getSet_();
    setWrote = true;
  }
  var res = {ok: true};
  if (r.pull === false) {
    if (r.sget && set) res.settings = {u: set.u, data: set.data};
    return res;
  }
  var since = Number(r.since || 0) - 2000, cand = [];
  for (i = 0; i < vals.length; i++) {
    var S = Number(vals[i][2]);
    if (S > since && !wrote[String(vals[i][0])]) cand.push(vals[i]);
  }
  cand.sort(function (a, b) { return Number(a[2]) - Number(b[2]); });
  res.more = false;
  res.upto = now;
  if (cand.length > 800) {
    cand = cand.slice(0, 800);
    res.more = true;
    res.upto = Number(cand[cand.length - 1][2]);
  }
  res.items = [];
  cand.forEach(function (row) { try { res.items.push(JSON.parse(row[12])); } catch (e) {} });
  if (set && !setWrote && (!r.since || Number(set.S) > since)) res.settings = {u: set.u, data: set.data};
  return res;
}

/* ---- Email ---- */
function e_(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function money_(n) { return '₱' + Number(n || 0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function kv_(a, b) {
  return '<tr><td style="padding:6px 8px;border-bottom:1px solid #eee">' + a + '</td><td style="padding:6px 8px;border-bottom:1px solid #eee;text-align:right"><b>' + b + '</b></td></tr>';
}

function mail_(d, force) {
  var p = props_();
  if (!force && p.getProperty('MAILED') === d) return {ok: true, skipped: true};
  var s = items_(), last = s.getLastRow();
  var vals = last > 1 ? s.getRange(2, 1, last - 1, NCOL).getValues() : [];
  var tx = [], op = null, cl = null;
  vals.forEach(function (r) {
    if (Number(r[11]) || String(r[4]) !== d) return;
    var o;
    try { o = JSON.parse(r[12]); } catch (e) { return; }
    if (r[3] === 'open') op = o;
    else if (r[3] === 'close') cl = o;
    else tx.push(o);
  });
  if (!force && !tx.length && !cl) return {ok: true, skipped: true};
  var T = {i: 0, o: 0, p: 0}, by = {};
  tx.forEach(function (t) {
    var n = NAMES[t.s] || t.s;
    var b = by[n] = by[n] || {c: 0, i: 0, o: 0, p: 0};
    b.c++; b.i += t.i; b.o += t.o; b.p += t.p;
    T.i += t.i; T.o += t.o; T.p += t.p;
    if (t.s === 'others' && t.ty === 'puhunan') T.a = (T.a || 0) + t.i;
  });
  var shop = 'Bayad Center POS', set = getSet_();
  if (set && set.data && set.data.shop) shop = set.data.shop;
  var h = '<div style="font-family:Arial,sans-serif;max-width:640px">';
  h += '<h2 style="color:#1d4ed8;margin-bottom:4px">' + e_(shop) + '</h2><div style="color:#555;margin-bottom:12px">Buod ng ' + e_(d) + '</div>';
  h += '<table style="border-collapse:collapse;width:100%;font-size:15px">';
  h += kv_('⬇️ Pumasok', money_(T.i)) + kv_('⬆️ Lumabas', money_(T.o)) + kv_('💰 Tubo', money_(T.p)) + kv_('Bilang ng transaksyon', tx.length);
  if (op) h += kv_('💼 Cash na dala sa umaga', money_(op.v)) + (T.a ? kv_('➕ Dagdag cash', money_(T.a)) : '') + kv_('👛 Dapat na cash ngayon', money_(op.v + T.i - T.o));
  if (cl) h += kv_('✅ Cash na nabilang', money_(cl.counted)) + kv_('Sobra / Kulang', cl.diff ? money_(cl.diff) : 'Tama');
  if (cl && cl.left !== undefined) h += kv_('🏪 Iniwan sa drawer', money_(cl.left)) + '<tr style="background:#dcfce7"><td style="padding:10px 8px;font-size:17px">💵 <b>CASH NA IUWI</b></td><td style="padding:10px 8px;text-align:right;font-size:20px;color:#15803d"><b>' + money_(cl.take) + '</b></td></tr>';
  else h += '<tr><td colspan="2" style="padding:8px;color:#b45309">⚠️ Hindi pa naisara ang araw sa app.</td></tr>';
  h += '</table>';
  if (cl && cl.bd) {
    var bk = Object.keys(cl.bd).filter(function (k) { return k !== 'x'; }).map(Number).sort(function (a, b) { return b - a; });
    h += '<h3 style="margin-top:18px">🧾 Bilang ng cash</h3><table style="border-collapse:collapse;width:100%;font-size:14px">';
    bk.forEach(function (k) { h += kv_('₱' + k + ' × ' + cl.bd[k], money_(k * cl.bd[k])); });
    if (cl.bd.x) h += kv_('Iba pa', money_(cl.bd.x));
    h += '</table>';
  }
  h += '<h3 style="margin-top:18px">Kada serbisyo</h3><table style="border-collapse:collapse;width:100%;font-size:14px"><tr style="background:#eef2ff"><th align="left" style="padding:6px">Serbisyo</th><th>Bilang</th><th align="right">Pasok</th><th align="right">Labas</th><th align="right">Tubo</th></tr>';
  Object.keys(by).forEach(function (n) {
    var b = by[n];
    h += '<tr><td style="padding:5px 6px;border-bottom:1px solid #eee">' + e_(n) + '</td><td align="center">' + b.c + '</td><td align="right">' + money_(b.i) + '</td><td align="right">' + money_(b.o) + '</td><td align="right">' + money_(b.p) + '</td></tr>';
  });
  h += '</table>';
  tx.sort(function (a, b) { return a.t - b.t; });
  h += '<h3 style="margin-top:18px">Mga transaksyon</h3><table style="border-collapse:collapse;width:100%;font-size:13px"><tr style="background:#eef2ff"><th align="left" style="padding:5px">Oras</th><th align="left">Serbisyo</th><th align="left">Detalye</th><th align="right">Halaga</th><th align="right">Tubo</th></tr>';
  tx.slice(0, 300).forEach(function (t) {
    var tm = Utilities.formatDate(new Date(t.t), TZ, 'h:mm a');
    var amt = t.i > 0 ? '+' + money_(t.i) : '-' + money_(t.o);
    h += '<tr><td style="padding:4px 5px;border-bottom:1px solid #eee">' + e_(tm) + '</td><td>' + e_(NAMES[t.s] || t.s) + ' ' + e_(String(t.tl || '').split(' (')[0]) + '</td><td>' + e_(t.det || '') + '</td><td align="right">' + amt + '</td><td align="right">' + money_(t.p) + '</td></tr>';
  });
  h += '</table>';
  if (tx.length > 300) h += '<p>...at ' + (tx.length - 300) + ' pa. Tingnan sa app o sa Google Sheet.</p>';
  h += '<p style="color:#888;margin-top:20px">Likha ni: Sir Leo</p></div>';
  var to = p.getProperty('MAIL_TO') || Session.getEffectiveUser().getEmail();
  MailApp.sendEmail({to: to, subject: shop + ' - Buod ng ' + d, htmlBody: h, name: shop});
  p.setProperty('MAILED', d);
  return {ok: true, sent: to};
}

function nightly() {
  var d = Utilities.formatDate(new Date(), TZ, 'yyyy-MM-dd');
  mail_(d, false);
}

function setTrigger_(h) {
  ScriptApp.getProjectTriggers().forEach(function (t) {
    if (t.getHandlerFunction() === 'nightly') ScriptApp.deleteTrigger(t);
  });
  ScriptApp.newTrigger('nightly').timeBased().atHour(h).nearMinute(0).everyDays(1).inTimezone(TZ).create();
}

function cfg_(r) {
  var p = props_();
  if (r.email !== undefined) p.setProperty('MAIL_TO', String(r.email || ''));
  if (r.hour !== undefined) {
    var h = parseInt(r.hour, 10);
    if (h >= 0 && h <= 23) { p.setProperty('HOUR', String(h)); setTrigger_(h); }
  }
  return {ok: true};
}
</script>

<script>
'use strict';
/* ========= Helpers ========= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const peso=n=>'₱'+(Number(n)||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dstr(new Date());
const tstr=d=>{let h=d.getHours();const ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+pad(d.getMinutes())+' '+ap};

function hash(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)}

/* ========= Computation ========= */
function flow(k,v){
 const F={in:()=>({i:v.a+v.f,o:0,p:v.f}),out:()=>v.fc?({i:v.f,o:v.a,p:v.f}):({i:0,o:v.a,p:v.f}),incl:()=>({i:v.a,o:0,p:v.f}),
  sim:()=>({i:v.a*v.q,o:0,p:(v.a-v.c)*v.q}),kita:()=>({i:v.a,o:0,p:v.a}),gastos:()=>({i:0,o:v.a,p:-v.a}),
  puhunan:()=>({i:v.a,o:0,p:0}),kuha:()=>({i:0,o:v.a,p:0})};
 const r=F[k]();return {i:r2(r.i),o:r2(r.o),p:r2(r.p)}}
function calcFee(k,a){const r=DB.s.fees[k];if(!r)return 0;if(r.m==='flat')return r.f;if(!(a>0))return 0;if(r.m==='unit')return r2(Math.ceil(a/r.u)*r.f);return r2(a*r.f/100)}
function infoText(k,v,r){const L={
 in:`Kunin sa customer: <b>${peso(r.i)}</b><br>Tubo mo: <b>${peso(r.p)}</b>`,
 out:v.fc?`I-abot na cash: <b>${peso(v.a)}</b><br>Kunin na patong (cash): <b>${peso(v.f)}</b><br>Dapat i-send ng customer: <b>${peso(v.a)}</b><br>Tubo mo: <b>${peso(r.p)}</b>`:`I-abot na cash: <b>${peso(r.o)}</b><br>Dapat i-send ng customer: <b>${peso(v.a+v.f)}</b><br>Tubo mo: <b>${peso(r.p)}</b>`,
 incl:`Babayaran ng customer: <b>${peso(r.i)}</b><br>Tubo mo: <b>${peso(r.p)}</b>`,
 sim:`Kabuuang bayad: <b>${peso(r.i)}</b><br>Tubo mo: <b>${peso(r.p)}</b>`,
 kita:`Papasok: <b>${peso(r.i)}</b>`,gastos:`Lalabas: <b>${peso(r.o)}</b>`,
 puhunan:`Papasok (walang tubo): <b>${peso(r.i)}</b>`,kuha:`Lalabas (walang tubo): <b>${peso(r.o)}</b>`};return L[k]}
const live=()=>DB.tx.filter(t=>!t.del);
function sum(list){return list.reduce((s,t)=>(s.i+=t.i,s.o+=t.o,s.p+=t.p,s.n++,s),{i:0,o:0,p:0,n:0})}
function detailOf(t){const S=SV[t.s],x=t.x||{};let p;
 if(t.s==='appt')p=[x.cust,(x.date?fmtDate(x.date):'')+(x.time?' '+x.time:''),x.tel,x.st==='Tapos na'?'✅ Tapos':x.st==='Na-cancel'?'❌ Cancel':'🕒'];
 else{p=S.fl.map(f=>x[f.k]);if(S.sim&&t.q>1)p.push('×'+t.q)}
 return p.filter(Boolean).join(' • ')}

/* ========= Storage (localStorage + IndexedDB + daily backups) ========= */
const Store={db:null,
 open(){return new Promise(r=>{try{const q=indexedDB.open('bcpos',1);q.onupgradeneeded=()=>{q.result.createObjectStore('kv');q.result.createObjectStore('bk')};q.onsuccess=()=>{this.db=q.result;r(1)};q.onerror=q.onblocked=()=>r(0)}catch(e){r(0)}})},
 req(st,mode,fn){return new Promise(r=>{if(!this.db)return r(null);try{const t=this.db.transaction(st,mode);const q=fn(t.objectStore(st));t.oncomplete=()=>r(q?(q.result===undefined?null:q.result):true);t.onerror=t.onabort=()=>r(null)}catch(e){r(null)}})},
 get(k){return this.req('kv','readonly',s=>s.get(k))},
 put(v){return this.req('kv','readwrite',s=>s.put(v,'main'))},
 putBk(k,v){return this.req('bk','readwrite',s=>s.put(v,k))},
 getBk(k){return this.req('bk','readonly',s=>s.get(k))},
 delBk(k){return this.req('bk','readwrite',s=>s.delete(k))},
 async bks(){const ks=await this.req('bk','readonly',s=>s.getAllKeys());const vs=await this.req('bk','readonly',s=>s.getAll());if(!Array.isArray(ks)||!Array.isArray(vs))return [];return ks.map((k,i)=>({k,v:vs[i]})).filter(b=>typeof b.v==='string'&&/^\d{4}-\d\d-\d\d/.test(b.k)).sort((a,b)=>b.k<a.k?-1:1)},
 async prune(){const ks=(await this.req('bk','readonly',s=>s.getAllKeys()))||[];const d=ks.filter(k=>/^\d{4}-\d\d-\d\d$/.test(k)).sort().reverse();for(const k of d.slice(30))await this.delBk(k)}
};
function fresh(){return {v:1,sv:0,tx:[],rec:[],sy:{url:'',key:'',pushed:0,since:0,su:0,ss:'',sinit:0,mq:[]},s:{shop:'Bayad Center POS',open:0,pin:hp('1234'),defPin:1,rec:rcode(),lb:0,opens:{},email:'',mailHour:21,outFee:'cash',drawer:0,
 fees:JSON.parse(JSON.stringify(DEF_FEES)),
 banks:['BDO','BPI','Metrobank','Landbank','UnionBank','PNB','Security Bank','RCBC','China Bank','Iba pa'],
 billers:['PALECO','Roxas Water District','Meralco','Maynilad','Manila Water','Water District','PLDT','Converge','Globe Postpaid','Smart Postpaid','SSS','PhilHealth','Pag-IBIG','Cable / TV','Insurance','Loan / Credit Card','Iba pa'],
 nets:['Globe','Smart','TNT','TM','GOMO','DITO','Sun','Iba pa'],
 sims:['Globe SIM','Smart SIM','TNT SIM','TM SIM','DITO SIM','GOMO SIM','Iba pa']}}}
const valid=d=>d&&typeof d==='object'&&Array.isArray(d.tx)&&d.s&&typeof d.s==='object';
function migrate(d){const f=fresh().s;d.s=Object.assign({},f,d.s||{});d.s.fees=Object.assign({},f.fees,d.s.fees||{});
 ['banks','billers','nets','sims'].forEach(k=>{if(!Array.isArray(d.s[k])||!d.s[k].length)d.s[k]=f[k]});
 if(!d.s.opens||typeof d.s.opens!=='object')d.s.opens={};
 if(!d.s.mig1){['Roxas Water District','PALECO'].forEach(b=>{if(!d.s.billers.some(x=>String(x).toLowerCase()===b.toLowerCase()))d.s.billers.unshift(b)});d.s.mig1=1}
 d.tx=d.tx.filter(t=>t&&typeof t==='object'&&SV[t.s]);
 d.tx.forEach(t=>{t.x=t.x||{};['a','f','i','o','p','t'].forEach(k=>{t[k]=Number(t[k])||0});t.tl=t.tl||'';t.d=t.d||today();t.id=t.id||uid();if(!(t.u>0))t.u=t.t||Date.now()});
 if(!Array.isArray(d.rec))d.rec=[];d.rec=d.rec.filter(r=>r&&typeof r==='object'&&r.id&&r.k);
 Object.keys(d.s.opens).forEach(k=>{if(!d.rec.some(r=>r.id==='open_'+k))d.rec.push({id:'open_'+k,k:'open',d:k,v:Number(d.s.opens[k])||0,u:Date.now()})});d.s.opens={};
 d.sy=Object.assign({url:'',key:'',pushed:0,since:0,su:0,ss:'',sinit:0,mq:[]},d.sy||{});if(!Array.isArray(d.sy.mq))d.sy.mq=[];
 return d}
function setSt(ok){SY.localOk=ok;showSt()}
function save(nosync){DB.sv=Date.now();const s=JSON.stringify(DB);let ok=false;
 try{localStorage.setItem(LS,s);ok=true}catch(e){}
 Store.put(s).then(k=>setSt(ok||!!k));
 if(Date.now()-lastSnap>6e5){lastSnap=Date.now();Store.putBk(today(),s).then(()=>Store.prune())}
 if(!nosync)schedSync()}
async function boot(){
 await Store.open();const c=[];
 try{const a=localStorage.getItem(LS);if(a)c.push(a)}catch(e){}
 const b=await Store.get('main');if(b)c.push(b);
 let best=null,note='';
 for(const x of c){try{const d=JSON.parse(x);if(valid(d)&&(!best||(d.sv||0)>(best.sv||0)))best=d}catch(e){}}
 if(!best){
  if(c.length)await Store.putBk('corrupt-'+Date.now(),c[0]);
  for(const x of await Store.bks()){try{const d=JSON.parse(x.v);if(valid(d)){best=d;note='⚠️ Naibalik ang data mula sa auto-backup ng '+x.k.slice(0,10);break}}catch(e){}}
 }
 DB=best?migrate(best):fresh();
 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
 save();render();if(note)setTimeout(()=>toast(note),600);startBg();askOpen()}

 const c=DB.rec.filter(x=>!x.del&&x.d<d&&(x.k==='open'||x.k==='close')).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:(a.k==='open'?-1:1)).pop();

function histList(){const q=H.q.toLowerCase();
 return live().filter(t=>(!H.from||t.d>=H.from)&&(!H.to||t.d<=H.to)&&(H.svc==='all'||t.s===H.svc)&&(!q||(detailOf(t)+' '+SV[t.s].n+' '+t.tl).toLowerCase().includes(q))).sort((a,b)=>b.t-a.t)}
function histHTML(){
 return `<div class="card"><h2>📜 History</h2><div class="chips"><button class="chip" onclick="setRange('today')">Ngayon</button><button class="chip" onclick="setRange('yest')">Kahapon</button><button class="chip" onclick="setRange('7')">7 Araw</button><button class="chip" onclick="setRange('month')">Buwan na ito</button><button class="chip" onclick="setRange('all')">Lahat</button></div>
 <div class="grid" style="margin:0"><div><label>Mula</label><input type="date" id="h_from" value="${H.from}" onchange="H.from=this.value;histUpdate()"></div><div><label>Hanggang</label><input type="date" id="h_to" value="${H.to}" onchange="H.to=this.value;histUpdate()"></div></div>
 <label>Serbisyo</label><select onchange="H.svc=this.value;histUpdate()"><option value="all">Lahat</option>${Object.keys(SV).map(k=>`<option value="${k}"${H.svc===k?' selected':''}>${SV[k].n}</option>`).join('')}</select>
 <label>Hanapin (pangalan / number)</label><input type="search" value="${esc(H.q)}" onchange="H.q=this.value;histUpdate()" placeholder="Hal. Juan"></div><div id="hres">${histRes()}</div>`}
function setRange(k){const n=new Date();let f,t=today();
 if(k==='today')f=t;else if(k==='yest'){f=t=dstr(new Date(Date.now()-864e5))}
 else if(k==='7')f=dstr(new Date(Date.now()-6*864e5));else if(k==='month')f=dstr(new Date(n.getFullYear(),n.getMonth(),1));else{f='';t=''}
 H.from=f;H.to=t;H.lim=100;$('#h_from').value=f;$('#h_to').value=t;histUpdate()}
function histUpdate(){const e=$('#hres');if(e)e.innerHTML=histRes()}
function histRes(){const L=histList(),T=sum(L),by={};
 L.forEach(t=>{const b=by[t.s]=by[t.s]||{i:0,o:0,p:0,n:0};b.i+=t.i;b.o+=t.o;b.p+=t.p;b.n++});
 let h='<div class="grid">'+K('⬇️ Pumasok',peso(T.i),'#22c55e,#15803d')+K('⬆️ Lumabas',peso(T.o),'#f87171,#b91c1c')+K('💰 Tubo',peso(T.p),'#6366f1,#4338ca')+K('🧮 Bilang',T.n,'#64748b,#334155')+'</div>';
 h+=`<div class="card"><h2>Buod kada serbisyo</h2><div class="tw"><table><tr><th>Serbisyo</th><th>Bilang</th><th>Pasok</th><th>Labas</th><th>Tubo</th></tr>${Object.keys(by).map(k=>`<tr><td><b>${SV[k].n}</b></td><td>${by[k].n}</td><td class="pos">${peso(by[k].i)}</td><td class="neg">${peso(by[k].o)}</td><td class="pos">${peso(by[k].p)}</td></tr>`).join('')||'<tr><td colspan="5" style="text-align:center;color:#94a3b8;padding:14px">Walang data</td></tr>'}</table></div></div>`;
 h+=closesHTML();
 h+=`<div class="card"><div class="hd"><h2 style="margin:0">Mga Transaksyon</h2><span class="cnt">${L.length}</span></div><div class="tw"><table>${thead(true)}${rowsHTML(L.slice(0,H.lim),true)}</table></div>${L.length>H.lim?'<button class="btn sec" onclick="H.lim+=100;histUpdate()">Magpakita pa</button>':''}<button class="btn sec" onclick="csv()">⬇️ I-download bilang CSV (Excel)</button></div>`;
 return h}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function csv(){const q=v=>{v=String(v==null?'':v);if(/^[=+\-@]/.test(v)&&isNaN(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
 const R=[['Petsa','Oras','Serbisyo','Uri','Detalye','Pumasok','Lumabas','Tubo','Nag-record']];
 histList().forEach(t=>R.push([t.d,tstr(new Date(t.t)),SV[t.s].n,t.tl,detailOf(t),t.i,t.o,t.p,t.by||'']));
 dl('bayad-center-history.csv','\ufeff'+R.map(r=>r.map(q).join(',')).join('\n'),'text/csv')}

async function call(body){const Y=DB.sy;body.k=Y.key;const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),30000);

  let j;try{j=await r.json()}catch(e){throw new Error('Mali ang sagot ng server. Na-deploy ba bilang "Anyone"?')}
  if(!j.ok)throw new Error(j.err||'error');return j}
 finally{clearTimeout(to)}}
function applyRemote(res){const Y=DB.sy;let ch=0;
 const mt=new Map(DB.tx.map(t=>[t.id,t])),mr=new Map(DB.rec.map(t=>[t.id,t]));
 (res.items||[]).forEach(it=>{if(!it||typeof it!=='object'||!it.id)return;delete it.det;const rec=!!it.k;if(!rec&&!SV[it.s])return;
  if(!rec){['a','f','i','o','p','t','u'].forEach(k=>{it[k]=Number(it[k])||0});it.x=it.x||{};it.tl=it.tl||'';it.d=it.d||today()}else it.u=Number(it.u)||0;
  const M=rec?mr:mt,arr=rec?DB.rec:DB.tx,l=M.get(it.id);SY.clean.set(it.id,it.u);
  if(!l){arr.push(it);M.set(it.id,it);ch++}else if(it.u>(l.u||0)){Object.keys(l).forEach(k=>delete l[k]);Object.assign(l,it);ch++}});
 const st=res.settings;
 if(st&&st.data&&(st.u||0)>(Y.su||0)){const o=DB.s.opens,lb=DB.s.lb;Object.assign(DB.s,st.data);DB.s.opens=o||{};DB.s.lb=lb;Y.su=st.u;Y.ss=JSON.stringify(sCore());ch++}
 return ch}

async function syncNow(manual){const Y=DB&&DB.sy;if(!Y||!Y.url||!Y.key)return;
 if(SY.busy){SY.again=true;return}
 if(navigator.onLine===false&&!manual){SY.state='err';SY.err='Offline';showSt();return}
 SY.busy=true;SY.state='busy';SY.err='';showSt();let persist=false,ch=0;
 try{
  if(!Y.sinit){const r=await call({a:'sync',pull:false,sget:true,items:[]});if(r.settings)ch+=applyRemote({settings:r.settings});Y.sinit=1;persist=true}
  const stamp=Date.now(),sj=JSON.stringify(sCore());let setObj=null;
  if(sj!==Y.ss){Y.su=Date.now();setObj={u:Y.su,data:sCore()}}
  const dirty=DB.tx.concat(DB.rec).filter(t=>t.u>Y.pushed&&SY.clean.get(t.id)!==t.u).map(t=>Object.assign({},t,(!t.k&&SV[t.s])?{det:detailOf(t)}:{}));
  const chunks=Math.ceil(dirty.length/80);
  if(setObj&&!chunks)await call({a:'sync',pull:false,items:[],settings:setObj});
  for(let i=0;i<chunks;i++)await call({a:'sync',pull:false,items:dirty.slice(i*80,i*80+80),settings:i===0?setObj:null});
  if(dirty.length||setObj){Y.pushed=stamp-1;persist=true}
  if(setObj)Y.ss=sj;
  let since=Y.since,g=0,res;
  do{res=await call({a:'sync',since,items:[]});ch+=applyRemote(res);since=res.more?res.upto:res.now}while(res.more&&++g<60);
  Y.since=since;
  if(ch||persist)save(true);
  if(ch&&!typing())render();
  SY.state='ok';SY.last=Date.now();
  for(const d of Y.mq.slice()){try{await call({a:'mail',d,force:true});Y.mq=Y.mq.filter(x=>x!==d);save(true)}catch(e){SY.err='Email: '+friendly(e);break}}
 }catch(e){SY.state='err';SY.err=friendly(e)}
 finally{SY.busy=false;showSt()}
 if(manual)toast(SY.state==='ok'?'✅ Naka-sync':'❌ Hindi na-sync: '+SY.err);
 if(SY.again){SY.again=false;schedSync(1500)}}
function startBg(){lastDay=today();setInterval(()=>{dayCheck();if(!document.hidden)schedSync(100)},45000);
 try{window.addEventListener('online',()=>schedSync(500));window.addEventListener('offline',()=>{SY.state='err';showSt()});document.addEventListener('visibilitychange',()=>{if(!document.hidden){dayCheck();schedSync(300)}})}catch(e){}
 schedSync(800)}
function restoreSwap(d){const oy=DB.sy;DB=migrate(d);const n=Date.now();DB.tx.forEach(t=>{t.u=n});DB.rec.forEach(t=>{t.u=n});
 DB.sy=Object.assign({},DB.sy,{url:oy.url,key:oy.key,pushed:0,since:0,su:0,ss:'',sinit:0,mq:[]});SY.clean.clear()}

boot();
